<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrailMate V2 — AllTrails 风格地图</title>
<style>
  :root {
    --font: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    font-family: var(--font); background: #e8e5df; 
    display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px 0;
  }

  .phone {
    width: 390px; height: 844px; border-radius: 32px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.15), 0 0 0 2px #1e293b;
    position: relative;
    background: #1a1a2e;
  }

  /* ====== MAP LAYER ====== */
  .map-container {
    position: absolute; inset: 0;
    background: 
      /* contour lines - simulated topographic pattern */
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(120,140,100,.04) 2px, rgba(120,140,100,.04) 4px),
      repeating-linear-gradient(80deg, transparent, transparent 3px, rgba(100,120,80,.03) 3px, rgba(100,120,80,.03) 6px),
      repeating-linear-gradient(160deg, transparent, transparent 5px, rgba(140,160,120,.02) 5px, rgba(140,160,120,.02) 10px),
      /* terrain color gradient */
      linear-gradient(180deg, 
        #c8d6a0 0%,      /* light green - farmland */
        #b8c890 15%,     /* olive green */
        #a0b878 30%,     /* medium green */
        #889860 50%,     /* forest green */
        #6d7d4a 65%,     /* darker green */
        #d4c8a0 65%,     /* tan - mountain transition */
        #c4b890 75%,     /* lighter tan */
        #b4a880 85%,     /* tan */
        #a49870 100%     /* dark tan */
      );
    background-size: 100% 100%;
    position: absolute; inset: 0;
  }

  /* trail path */
  .trail-path {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .trail-svg {
    position: absolute; width: 100%; height: 100%;
  }

  /* ====== MARKERS ====== */
  .marker {
    position: absolute; z-index: 10;
    transform: translate(-50%, -50%);
    transition: transform .2s;
  }
  .marker:hover { transform: translate(-50%, -50%) scale(1.15); }

  .marker-dot {
    width: 36px; height: 36px; border-radius: 50%;
    background: #1a1a2e;
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 14px; font-weight: 800;
    position: relative;
    cursor: pointer;
  }
  .marker-dot::after {
    content: '';
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid #1a1a2e;
  }
  .marker-dot.start {
    background: #059669; border-color: #34d399;
  }
  .marker-dot.end {
    background: #1a1a2e; border-color: white;
    box-shadow: 0 0 0 4px rgba(255,255,255,.3), 0 2px 8px rgba(0,0,0,.3);
  }
  .marker-dot.active {
    background: #f59e0b; border-color: #fbbf24;
    box-shadow: 0 0 0 4px rgba(245,158,11,.3), 0 2px 8px rgba(0,0,0,.3);
  }
  .marker-label {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 600; color: #1a1a2e; white-space: nowrap;
    text-shadow: 0 0 4px rgba(255,255,255,.8);
    text-align: center; line-height: 1.2;
  }
  .marker-label .sub { font-size: 9px; color: #475569; font-weight: 400; }

  /* flag marker */
  .flag-marker {
    position: absolute; z-index: 10;
    transform: translate(-50%, -100%);
  }
  .flag-body {
    width: 0; height: 0; 
    border-left: 12px solid #059669;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    position: absolute; top: 4px; left: 4px;
  }
  .flag-pole {
    width: 2px; height: 28px;
    background: #1a1a2e;
  }

  /* ====== TOP SEARCH BAR ====== */
  .top-overlay {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    padding: 12px 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.4), transparent);
  }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(20px);
    border-radius: 14px; padding: 10px 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; border: none; cursor: pointer;
    flex-shrink: 0;
  }
  .search-input {
    flex: 1; border: none; outline: none; font-size: 14px;
    background: transparent; font-family: var(--font);
  }
  .search-action {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; flex-shrink: 0;
    background: transparent;
  }

  /* ====== FILTER CHIPS ====== */
  .filter-chips {
    position: absolute; top: 82px; left: 0; right: 0; z-index: 30;
    padding: 0 14px;
    display: flex; gap: 8px; overflow-x: auto;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; white-space: nowrap; font-family: var(--font);
    background: rgba(255,255,255,.85); backdrop-filter: blur(10px);
    color: #334155; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    transition: all .15s;
  }
  .chip.active {
    background: #064e3b; color: white; box-shadow: 0 2px 8px rgba(5,150,105,.3);
  }

  /* ====== MAP CONTROLS ====== */
  .map-controls {
    position: absolute; right: 12px; top: 140px; z-index: 30;
    display: flex; flex-direction: column; gap: 8px;
  }
  .map-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.1);
    color: #334155;
  }
  .map-btn.primary {
    background: #059669; color: white;
    box-shadow: 0 2px 8px rgba(5,150,105,.3);
  }

  /* ====== ELEVATION PROFILE MINI ====== */
  .elevation-mini {
    position: absolute; right: 12px; top: 310px; z-index: 30;
    width: 56px; background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border-radius: 14px; padding: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.1);
    text-align: center;
  }
  .elev-mini-val { font-size: 16px; font-weight: 800; color: #059669; }
  .elev-mini-label { font-size: 10px; color: #64748b; margin-top: 2px; }

  /* ====== BOTTOM CARD ====== */
  .bottom-card {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
    background: linear-gradient(to top, rgba(15,23,42,.95) 0%, rgba(15,23,42,.9) 80%, transparent);
    padding: 20px 16px 12px;
    color: white;
  }
  .route-title-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .route-title {
    font-size: 18px; font-weight: 800;
  }
  .route-diff {
    padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700;
    background: #22c55e; color: #052e16;
  }
  .route-location {
    font-size: 12px; color: #94a3b8; margin-bottom: 2px;
  }
  .route-pace {
    font-size: 11px; color: #64748b;
    display: flex; align-items: center; gap: 3px;
  }

  .route-stats-row {
    display: flex; gap: 20px; margin: 12px 0;
  }
  .stat-item { text-align: center; }
  .stat-val { font-size: 18px; font-weight: 800; }
  .stat-label { font-size: 10px; color: #94a3b8; }

  .action-row {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .btn-action {
    flex: 1; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 700;
    border: none; cursor: pointer; font-family: var(--font);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: #059669; color: white; }
  .btn-secondary { 
    background: rgba(255,255,255,.1); color: white;
    border: 1px solid rgba(255,255,255,.15);
  }

  /* ====== BOTTOM TAB ====== */
  .bottom-tabs {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 40;
    display: flex; padding: 8px 16px 24px;
    background: rgba(15,23,42,.95); border-top: 1px solid rgba(255,255,255,.08);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; color: #64748b; cursor: pointer;
    border: none; background: none; font-family: var(--font); padding: 4px 0;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: #34d399; }
  .tab.active svg { stroke: #34d399; }

  /* distance marker along path */
  .dist-marker {
    position: absolute; z-index: 5;
    font-size: 9px; font-weight: 600; color: #475569;
    background: rgba(255,255,255,.7); padding: 1px 4px; border-radius: 4px;
    white-space: nowrap;
  }

  /* photo thumbnail on map */
  .photo-chip {
    position: absolute; z-index: 10;
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<div class="phone">

  <!-- ====== MAP ====== -->
  <div class="map-container">
    <!-- Trail path SVG -->
    <div class="trail-path">
      <svg class="trail-svg" viewBox="0 0 390 844" preserveAspectRatio="none">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Main trail dashed line -->
        <path d="M 100,200 Q 140,250 180,280 Q 230,320 200,380 Q 170,440 220,500 Q 260,550 300,580 Q 340,620 280,680" 
              fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8,4" opacity="0.8" filter="url(#glow)"/>
        <!-- Trail shadow -->
        <path d="M 102,202 Q 142,252 182,282 Q 232,322 202,382 Q 172,442 222,502 Q 262,552 302,582 Q 342,622 282,682" 
              fill="none" stroke="rgba(255,255,255,.3)" stroke-width="5" opacity="0.5"/>
      </svg>
    </div>

    <!-- Start flag -->
    <div class="flag-marker" style="left:100px; top:200px;">
      <div class="flag-pole"></div>
      <div class="flag-body"></div>
    </div>

    <!-- Markers -->
    <!-- 1 - Start -->
    <div class="marker" style="left:100px; top:200px;">
      <div class="marker-dot start">1</div>
      <div class="marker-label">南门<div class="sub">起点</div></div>
    </div>

    <!-- 2 -->
    <div class="marker" style="left:182px; top:282px;">
      <div class="marker-dot">2</div>
      <div class="marker-label">能仁寺<div class="sub">2.5km</div></div>
    </div>

    <!-- Photo chip near marker 2 -->
    <div class="photo-chip" style="left:210px; top:260px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </div>

    <!-- 3 -->
    <div class="marker" style="left:200px; top:380px;">
      <div class="marker-dot">3</div>
      <div class="marker-label">山顶广场<div class="sub">5.0km</div></div>
    </div>

    <!-- 4 - Active/Next -->
    <div class="marker" style="left:220px; top:500px;">
      <div class="marker-dot active">4</div>
      <div class="marker-label" style="color:#f59e0b;">摩星岭<div class="sub" style="color:#f59e0b;">7.5km · 当前</div></div>
    </div>

    <!-- Photo chip near marker 4 -->
    <div class="photo-chip" style="left:250px; top:480px; background: linear-gradient(135deg, #f59e0b, #ef4444);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </div>

    <!-- 5 -->
    <div class="marker" style="left:302px; top:582px;">
      <div class="marker-dot">5</div>
      <div class="marker-label">明珠楼<div class="sub">10.0km</div></div>
    </div>

    <!-- 6 - End -->
    <div class="marker" style="left:282px; top:682px;">
      <div class="marker-dot end">6</div>
      <div class="marker-label">西门<div class="sub">终点 · 15km</div></div>
    </div>

    <!-- Flag end -->
    <div class="flag-marker" style="left:282px; top:682px;">
      <div class="flag-pole" style="background:none; border-left:2px dashed rgba(255,255,255,.6); height:32px;"></div>
    </div>

    <!-- Distance marker on trail -->
    <div class="dist-marker" style="left:135px; top:252px;">3km</div>
    <div class="dist-marker" style="left:208px; top:435px;">6km</div>
    <div class="dist-marker" style="left:265px; top:555px;">9km</div>
    <div class="dist-marker" style="left:310px; top:630px;">12km</div>

    <!-- Map controls -->
    <div class="map-controls">
      <button class="map-btn primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </button>
      <button class="map-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </button>
      <button class="map-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Elevation profile mini -->
    <div class="elevation-mini">
      <div class="elev-mini-val">380m</div>
      <div class="elev-mini-label">爬升</div>
      <svg width="36" height="40" viewBox="0 0 36 40" style="margin-top:8px">
        <path d="M 2,38 Q 10,32 16,20 Q 20,14 22,10 Q 26,2 34,8" 
              fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="38" x2="34" y2="38" stroke="#64748b" stroke-width="0.5"/>
      </svg>
    </div>

  </div>

  <!-- ====== TOP SEARCH BAR ====== -->
  <div class="top-overlay">
    <div class="search-bar">
      <button class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <input class="search-input" placeholder="搜索路线、地点...">
      <button class="search-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div style="width:1px;height:24px;background:#e2e8f0;margin:0 4px;"></div>
      <button class="search-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
  </div>

  <!-- ====== FILTER CHIPS ====== -->
  <div class="filter-chips">
    <button class="chip active">全部路线</button>
    <button class="chip">初级</button>
    <button class="chip">中级</button>
    <button class="chip">高级</button>
    <button class="chip">近一周</button>
    <button class="chip">朋友去过</button>
  </div>

  <!-- ====== BOTTOM CARD ====== -->
  <div class="bottom-card">
    <div class="route-title-row">
      <span class="route-title">白云山穿越线</span>
      <span class="route-diff">中级</span>
    </div>
    <div class="route-location">广东广州 · 白云山风景区</div>
    <div class="route-pace">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      预估 4-5 小时 · 6个打卡点
    </div>

    <div class="route-stats-row">
      <div class="stat-item">
        <div class="stat-val" style="color:#34d399;">15<span style="font-size:12px;opacity:.7">km</span></div>
        <div class="stat-label">距离</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">380<span style="font-size:12px;opacity:.7">m</span></div>
        <div class="stat-label">爬升</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">4.8<span style="font-size:12px;opacity:.7">★</span></div>
        <div class="stat-label">评分</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">326</div>
        <div class="stat-label">完成人数</div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-action btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        开始征途
      </button>
      <button class="btn-action btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        收藏
      </button>
    </div>
  </div>

  <!-- ====== BOTTOM TABS ====== -->
  <div class="bottom-tabs">
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      首页
    </button>
    <button class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      探索
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      队伍
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      我的
    </button>
  </div>

</div>

</body>
</html>
