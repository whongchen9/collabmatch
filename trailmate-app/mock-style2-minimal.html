<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrailMate — 现代简约风</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --card-alt: #f5f5f5;
    --accent: #0066ff;
    --accent-light: #e8f0fe;
    --green: #00b341;
    --green-light: #e6f7ec;
    --amber: #f5a623;
    --amber-light: #fef7ed;
    --text: #0a0a0a;
    --text-sec: #555555;
    --text-dim: #999999;
    --border: #e8e8e8;
    --divider: #f0f0f0;
    --font: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    --radius: 6px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font); background: #e8e8e8;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 24px 0;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 390px; min-height: 844px; background: var(--bg);
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 2px 40px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
    position: relative;
  }
  .content { position: relative; z-index: 1; padding-bottom: 90px; }

  /* Status Bar */
  .status-bar {
    height: 44px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; color: var(--text-dim);
    letter-spacing: .3px;
  }

  /* Hero — clean, Swiss style */
  .hero {
    padding: 12px 20px 28px;
  }
  .hero-label {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
  }
  .hero-title {
    font-size: 32px; font-weight: 300; color: var(--text);
    line-height: 1.15; letter-spacing: -1px; margin-bottom: 16px;
  }
  .hero-title b { font-weight: 700; }
  .hero-title .accent { color: var(--accent); font-weight: 400; }

  /* Big stat number */
  .hero-highlight {
    display: flex; align-items: baseline; gap: 4px; margin-bottom: 20px;
  }
  .hero-number {
    font-size: 48px; font-weight: 300; color: var(--text);
    line-height: 1; letter-spacing: -2px;
  }
  .hero-unit {
    font-size: 14px; font-weight: 400; color: var(--text-dim);
  }

  /* Stat row — minimal pills */
  .hero-stats {
    display: flex; gap: 20px;
  }
  .hero-stat {
    display: flex; flex-direction: column;
  }
  .hero-stat .val {
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 500; color: var(--text);
    letter-spacing: -0.5px;
  }
  .hero-stat .lbl {
    font-size: 10px; font-weight: 400; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;
  }

  /* Divider */
  .divider {
    height: 1px; background: var(--divider); margin: 0 20px;
  }

  /* Section */
  .section { padding: 0 20px; margin-bottom: 24px; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-top: 24px;
  }
  .sec-title {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 2px;
  }
  .sec-link {
    font-size: 11px; font-weight: 500; color: var(--accent);
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center; gap: 4px;
  }
  .sec-link::after { content: '→'; }

  /* Quick Actions — clean minimal buttons */
  .quick-actions {
    display: flex; gap: 8px; padding: 0 20px; margin-bottom: 0;
  }
  .qa-btn {
    flex: 1; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--card);
    cursor: pointer; display: flex; align-items: center;
    gap: 10px; transition: all .15s;
  }
  .qa-btn:hover { border-color: var(--accent); }
  .qa-btn.primary {
    background: var(--text); border-color: var(--text); color: #fff;
  }
  .qa-btn.primary:hover { background: #1a1a1a; }
  .qa-btn-icon {
    width: 32px; height: 32px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    background: var(--divider);
  }
  .qa-btn.primary .qa-btn-icon { background: rgba(255,255,255,.15); }
  .qa-btn-text { text-align: left; }
  .qa-btn-label {
    font-size: 13px; font-weight: 600; color: var(--text);
    display: block;
  }
  .qa-btn.primary .qa-btn-label { color: #fff; }
  .qa-btn-hint {
    font-size: 10px; color: var(--text-dim); display: block;
    margin-top: 1px;
  }
  .qa-btn.primary .qa-btn-hint { color: rgba(255,255,255,.5); }

  /* Intent Card — architectural minimal */
  .intent-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
  }
  .intent-row {
    display: flex; align-items: flex-start; gap: 14px;
    margin-bottom: 14px;
  }
  .intent-icon {
    width: 40px; height: 40px; border-radius: var(--radius);
    background: var(--divider);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .intent-info { flex: 1; min-width: 0; }
  .intent-name {
    font-size: 15px; font-weight: 600; color: var(--text);
    letter-spacing: -0.2px; margin-bottom: 3px;
  }
  .intent-meta {
    font-size: 11px; color: var(--text-dim); letter-spacing: .1px;
  }
  .intent-status {
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 500; padding: 3px 8px;
    border-radius: 3px; letter-spacing: .5px; flex-shrink: 0;
  }
  .status-matching {
    background: var(--amber-light); color: var(--amber);
  }

  .intent-tags {
    display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .tag {
    font-size: 10px; font-weight: 400; padding: 2px 8px;
    border-radius: 3px; letter-spacing: .2px;
    background: var(--divider); color: var(--text-dim);
  }
  .intent-progress {
    height: 2px; background: var(--divider);
    margin-bottom: 14px; overflow: hidden;
  }
  .intent-progress-bar {
    height: 100%; background: var(--text);
  }
  .intent-footer {
    display: flex; align-items: center; justify-content: space-between;
  }
  .intent-avatars { display: flex; }
  .intent-avatars .av {
    width: 24px; height: 24px; border-radius: 3px;
    margin-left: -3px; border: 1.5px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: #fff;
  }
  .intent-avatars .av:first-child { margin-left: 0; }
  .intent-count {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; color: var(--text-dim);
  }

  /* Team Card */
  .team-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: border-color .15s;
  }
  .team-card:hover { border-color: var(--accent); }
  .team-icon {
    width: 44px; height: 44px; border-radius: var(--radius);
    background: var(--accent-light); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; flex-shrink: 0;
  }
  .team-info { flex: 1; min-width: 0; }
  .team-name {
    font-size: 15px; font-weight: 600; color: var(--text);
    margin-bottom: 2px; letter-spacing: -0.2px;
  }
  .team-meta {
    font-size: 11px; color: var(--text-dim);
  }
  .team-badge {
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 500; padding: 3px 8px;
    border-radius: 3px; letter-spacing: .5px; flex-shrink: 0;
  }
  .badge-active {
    background: var(--green-light); color: var(--green);
    display: flex; align-items: center; gap: 5px;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--green);
  }

  /* Route Cards — geometric minimal */
  .route-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 2px; scroll-snap-type: x mandatory;
  }
  .route-scroll::-webkit-scrollbar { display: none; }
  .route-card {
    min-width: 200px; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--border); scroll-snap-align: start;
    cursor: pointer; flex-shrink: 0; background: var(--card);
    transition: border-color .15s;
  }
  .route-card:hover { border-color: var(--accent); }
  .route-cover {
    height: 100px; position: relative; padding: 14px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .route-diff {
    position: absolute; top: 10px; right: 10px;
    font-family: var(--font-mono);
    font-size: 8px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; padding: 2px 6px; border-radius: 2px;
    background: rgba(255,255,255,.9); color: var(--text);
  }
  .route-name {
    font-size: 15px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.3);
    margin-bottom: 1px;
  }
  .route-loc {
    font-size: 10px; color: rgba(255,255,255,.75);
  }
  .route-body { padding: 12px 14px; }
  .route-stats {
    display: flex; gap: 14px; margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; color: var(--text-dim);
  }
  .route-tags { display: flex; gap: 5px; flex-wrap: wrap; }

  /* Bottom Tab */
  .bottom-tab {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    display: flex; padding: 6px 12px 24px;
    background: rgba(250,250,250,.9); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px 0; cursor: pointer; border: none;
    background: none; font-family: var(--font);
    font-size: 9px; font-weight: 500; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
    transition: color .15s;
  }
  .tab-item.active { color: var(--text); }
  .tab-item.active::before {
    content: ''; width: 16px; height: 2px; background: var(--text);
    border-radius: 1px; margin-bottom: 3px;
  }
  .tab-item svg { width: 18px; height: 18px; display: none; }
  .tab-item .tab-dot {
    width: 3px; height: 3px; border-radius: 50%; background: currentColor;
    margin-bottom: 4px;
  }
  .tab-item.active .tab-dot { background: var(--text); }
  .tab-item:not(.active) .tab-dot { opacity: 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="content">

    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span>88%</span>
    </div>

    <!-- Hero -->
    <div class="hero">
      <div class="hero-label">TrailMate / 首页</div>
      <div class="hero-title"><b>小张</b>，<span class="accent">出发</span>吧</div>
      <div class="hero-highlight">
        <span class="hero-number">126</span>
        <span class="hero-unit">km 累计</span>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="val">8</span>
          <span class="lbl">完成征途</span>
        </div>
        <div class="hero-stat">
          <span class="val">12</span>
          <span class="lbl">招募中</span>
        </div>
        <div class="hero-stat">
          <span class="val">92%</span>
          <span class="lbl">信用</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Quick Actions -->
    <div class="section" style="padding-top:28px;">
      <div class="quick-actions">
        <button class="qa-btn primary">
          <div class="qa-btn-icon">+</div>
          <div class="qa-btn-text">
            <span class="qa-btn-label">发起组队</span>
            <span class="qa-btn-hint">创建你的队伍</span>
          </div>
        </button>
        <button class="qa-btn">
          <div class="qa-btn-icon">→</div>
          <div class="qa-btn-text">
            <span class="qa-btn-label">快速匹配</span>
            <span class="qa-btn-hint">AI 智能匹配</span>
          </div>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Active Intent -->
    <div class="section">
      <div class="sec-head">
        <span class="sec-title">当前意图</span>
        <a class="sec-link">查看全部</a>
      </div>
      <div class="intent-card">
        <div class="intent-row">
          <div class="intent-icon">⛰</div>
          <div class="intent-info">
            <div class="intent-name">周末白云山轻徒步</div>
            <div class="intent-meta">广州 · 6月21日 周六 · 3-5人 · 初级</div>
          </div>
          <span class="intent-status status-matching">匹配中</span>
        </div>
        <div class="intent-tags">
          <span class="tag">休闲</span><span class="tag">摄影</span><span class="tag">新手</span>
        </div>
        <div class="intent-progress">
          <div class="intent-progress-bar" style="width:60%"></div>
        </div>
        <div class="intent-footer">
          <div class="intent-avatars">
            <div class="av" style="background:#0066ff;">李</div>
            <div class="av" style="background:#f5a623;">王</div>
            <div class="av" style="background:#666;">+2</div>
          </div>
          <span class="intent-count">3/5</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- My Team -->
    <div class="section">
      <div class="sec-head">
        <span class="sec-title">我的队伍</span>
        <a class="sec-link" style="display:flex;align-items:center;gap:5px;">
          <span class="dot"></span>进行中
        </a>
      </div>
      <div class="team-card">
        <div class="team-icon">白</div>
        <div class="team-info">
          <div class="team-name">白云山徒步小分队</div>
          <div class="team-meta">4人 · 6/21 08:00 · 摩星岭下一站</div>
        </div>
        <span class="team-badge badge-active">
          <span class="dot"></span>征途中
        </span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Recommended Routes -->
    <div class="section">
      <div class="sec-head">
        <span class="sec-title">推荐路线</span>
        <a class="sec-link">探索</a>
      </div>
      <div class="route-scroll">
        <div class="route-card">
          <div class="route-cover" style="background:#2c3e50;">
            <span class="route-diff">中级</span>
            <div class="route-name">白云山穿越线</div>
            <div class="route-loc">广东广州</div>
          </div>
          <div class="route-body">
            <div class="route-stats">
              <span>15km</span><span>4-5h</span><span>380m</span>
            </div>
            <div class="route-tags">
              <span class="tag">森林</span><span class="tag">城市</span>
            </div>
          </div>
        </div>
        <div class="route-card">
          <div class="route-cover" style="background:#8e6e53;">
            <span class="route-diff">高级</span>
            <div class="route-name">丹霞山穿越</div>
            <div class="route-loc">广东韶关</div>
          </div>
          <div class="route-body">
            <div class="route-stats">
              <span>22km</span><span>7-8h</span><span>680m</span>
            </div>
            <div class="route-tags">
              <span class="tag">丹霞</span><span class="tag">挑战</span>
            </div>
          </div>
        </div>
        <div class="route-card">
          <div class="route-cover" style="background:#4a7c96;">
            <span class="route-diff">初级</span>
            <div class="route-name">梧桐山休闲线</div>
            <div class="route-loc">广东深圳</div>
          </div>
          <div class="route-body">
            <div class="route-stats">
              <span>8km</span><span>2-3h</span><span>200m</span>
            </div>
            <div class="route-tags">
              <span class="tag">海景</span><span class="tag">亲子</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Tab -->
  <div class="bottom-tab">
    <button class="tab-item active">
      <span class="tab-dot"></span>首页
    </button>
    <button class="tab-item">
      <span class="tab-dot"></span>探索
    </button>
    <button class="tab-item">
      <span class="tab-dot"></span>队伍
    </button>
    <button class="tab-item">
      <span class="tab-dot"></span>我的
    </button>
  </div>
</div>
</body>
</html>
