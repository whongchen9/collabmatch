<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组队大厅重设计 Mockup</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    background: #f0ede7; display: flex; flex-direction: column; align-items: center;
    padding: 20px 12px; gap: 40px;
  }
  .phone {
    width: 390px; min-height: 860px; background: #f5f3ef;
    border-radius: 36px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.12);
    display: flex; flex-direction: column;
  }
  .phone-header {
    height: 40px; background: #f5f3ef;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #9ca3af;
  }
  .scroll-area { flex:1; overflow-y:auto; padding: 0 12px 12px; }

  /* ── 头卡 ── */
  .hero {
    background: linear-gradient(135deg, #10b981, #059669); color: #fff;
    border-radius: 20px; padding: 18px 16px 14px; margin: 8px 0 12px;
    box-shadow: 0 4px 18px rgba(16,185,129,.15);
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hero-brand { font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .hero-badge {
    width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
  }
  .hero-actions { display: flex; gap: 6px; }
  .hero-btn {
    width: 34px; height: 34px; border-radius: 10px; border: none;
    background: rgba(255,255,255,.15); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .hero-stats { display: flex; gap: 16px; }
  .hero-stat { text-align: center; }
  .hero-stat-val { font-size: 15px; font-weight: 900; }
  .hero-stat-label { font-size: 9px; opacity: .55; margin-top: 1px; }

  /* ── section card ── */
  .section {
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-bottom: 12px;
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; font-size: 11px; font-weight: 800; color: #374151;
  }
  .section-header.purple { border-left: 3px solid #8b5cf6; }
  .section-header.green { border-left: 3px solid #10b981; }
  .section-header.blue { border-left: 3px solid #60a5fa; }

  /* ── 我的意图卡片 ── */
  .intent-card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #f3f4f6;
    cursor: pointer;
  }
  .intent-card:last-child { border-bottom: none; }
  .intent-avatar {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .intent-info { flex:1; min-width: 0; }
  .intent-title { font-size: 12px; font-weight: 800; color: #1e293b; }
  .intent-meta { font-size: 9px; color: #9ca3af; margin-top: 2px; }
  .intent-action {
    padding: 6px 14px; border-radius: 20px; border: none;
    font-size: 10px; font-weight: 800; cursor: pointer;
    background: #8b5cf6; color: #fff; flex-shrink: 0;
  }
  .intent-action:hover { background: #7c3aed; }

  /* ── 我的队伍卡片 ── */
  .myteam-card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #f3f4f6;
    cursor: pointer; transition: .15s;
  }
  .myteam-card:last-child { border-bottom: none; }
  .myteam-card:hover { background: #fafbfc; }
  .myteam-avatar {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, #a7f3d0, #34d399);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; color: #065f46; flex-shrink: 0;
  }
  .myteam-info { flex:1; min-width: 0; }
  .myteam-name { font-size: 12px; font-weight: 800; color: #1e293b; }
  .myteam-detail { font-size: 9px; color: #9ca3af; margin-top: 2px; }
  .myteam-status {
    font-size: 8px; font-weight: 800; padding: 2px 7px; border-radius: 6px;
    flex-shrink: 0;
  }
  .myteam-status.hiking { background: #d1fae5; color: #065f46; }
  .myteam-status.idle { background: #f3f4f6; color: #6b7280; }
  .myteam-status.completed { background: #fef3c7; color: #92400e; }
  .myteam-arrow { color: #d1d5db; flex-shrink: 0; font-size: 16px; }

  /* ── 筛选标签 ── */
  .filter-row { display: flex; gap: 6px; padding: 4px 14px 12px; flex-wrap: wrap; }
  .filter-pill {
    padding: 4px 12px; border-radius: 20px; border: none;
    background: #f3f4f6; color: #6b7280;
    font-size: 10px; font-weight: 700; cursor: pointer;
  }
  .filter-pill.active { background: #d1fae5; color: #059669; }

  /* ── 房间网格 ── */
  .room-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 2px 14px 14px; }
  .room-card {
    aspect-ratio: 1; border-radius: 14px; overflow: hidden;
    position: relative; cursor: pointer;
    border: 2px solid #e5e7eb; transition: .15s;
  }
  .room-card:hover { border-color: #86efac; }
  .room-card-img {
    height: 100%; background: linear-gradient(180deg, #bae6fd, #e0f2fe, #86efac, #4ade80);
    position: relative;
  }
  .room-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,.35)); }
  .room-name {
    position: absolute; bottom: 6px; left: 6px; right: 6px;
    color: #fff; font-size: 9px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .room-hot {
    position: absolute; top: 4px; left: 4px;
    padding: 1px 5px; border-radius: 5px; background: #f97316;
    color: #fff; font-size: 7px; font-weight: 800;
    display: flex; align-items: center; gap: 2px;
  }
  .room-join {
    position: absolute; bottom: 6px; right: 6px;
    width: 26px; height: 26px; border-radius: 10px; border: none;
    background: #10b981; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .room-info {
    position: absolute; bottom: 0; left:0;right:0;
    padding: 3px 6px; background: rgba(255,255,255,.92);
    font-size: 7px; color: #6b7280; display: flex; justify-content: space-between;
  }

  .empty-state { padding: 20px 0; text-align: center; }
  .empty-icon {
    width: 36px; height: 36px; border-radius: 10px; background: #f3f4f6;
    margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;
    color: #d1d5db; font-size: 18px;
  }
  .empty-text { font-size: 10px; color: #9ca3af; }
  .empty-cta {
    margin-top: 6px; padding: 6px 16px; border-radius: 20px; border: none;
    background: #ecfdf5; color: #059669; font-size: 10px; font-weight: 700; cursor: pointer;
  }

</style>
</head>
<body>

<div class="phone">
  <div class="phone-header">🏠 组队大厅</div>
  <div class="scroll-area">

    <!-- 头卡 -->
    <div class="hero">
      <div class="hero-top">
        <div class="hero-brand">
          <div class="hero-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
          </div>
          TrailMate
        </div>
        <div class="hero-actions">
          <button class="hero-btn" title="筛选">&#x2630;</button>
          <button class="hero-btn" title="刷新">&#x21BB;</button>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hero-stat-val">3</div><div class="hero-stat-label">我的队伍</div></div>
        <div class="hero-stat"><div class="hero-stat-val">5</div><div class="hero-stat-label">招募中</div></div>
        <div class="hero-stat"><div class="hero-stat-val">2</div><div class="hero-stat-label">热门</div></div>
      </div>
    </div>

    <!-- 我的意图 -->
    <div class="section">
      <div class="section-header purple">
        <span style="display:flex;align-items:center;gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          我的意图
        </span>
        <span style="font-size:9px;color:#8b5cf6;background:#f5f3ff;padding:2px 8px;border-radius:8px;font-weight:700;">3个</span>
      </div>
      <div class="intent-card">
        <div class="intent-avatar">⛰</div>
        <div class="intent-info">
          <div class="intent-title">周末梧桐山日归</div>
          <div class="intent-meta">匹配度 95% · 5人待组队</div>
        </div>
        <button class="intent-action">继续匹配</button>
      </div>
      <div class="intent-card">
        <div class="intent-avatar">🏃</div>
        <div class="intent-info">
          <div class="intent-title">深圳湾晨跑</div>
          <div class="intent-meta">匹配度 72% · 2人待组队</div>
        </div>
        <button class="intent-action">继续匹配</button>
      </div>
      <div class="intent-card">
        <div class="intent-avatar">🌿</div>
        <div class="intent-info">
          <div class="intent-title">银湖山探索</div>
          <div class="intent-meta">未开始匹配</div>
        </div>
        <button class="intent-action" style="background:#f3f4f6;color:#6b7280;">开始匹配</button>
      </div>
    </div>

    <!-- 我的队伍 -->
    <div class="section">
      <div class="section-header green">
        <span style="display:flex;align-items:center;gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M3 21v-2a7 7 0 0 1 7-7h4a7 7 0 0 1 7 7v2"/></svg>
          我的队伍
        </span>
        <span style="font-size:9px;color:#10b981;background:#ecfdf5;padding:2px 8px;border-radius:8px;font-weight:700;">3个</span>
      </div>
      <div class="myteam-card" onclick>
        <div class="myteam-avatar">🥾</div>
        <div class="myteam-info">
          <div class="myteam-name">梧桐山攀登小分队</div>
          <div class="myteam-detail">深圳梧桐山 · 4/6人 · 最后消息：大家早上好！</div>
        </div>
        <span class="myteam-status hiking">征途中</span>
        <span class="myteam-arrow">›</span>
      </div>
      <div class="myteam-card">
        <div class="myteam-avatar">🌅</div>
        <div class="myteam-info">
          <div class="myteam-name">深圳湾晨跑</div>
          <div class="myteam-detail">深圳湾公园 · 2/4人 · 组队中</div>
        </div>
        <span class="myteam-status idle">等待出发</span>
        <span class="myteam-arrow">›</span>
      </div>
      <div class="myteam-card">
        <div class="myteam-avatar">🎉</div>
        <div class="myteam-info">
          <div class="myteam-name">塘朗山徒步</div>
          <div class="myteam-detail">深圳塘朗山 · 6/6人 · 全员凯旋</div>
        </div>
        <span class="myteam-status completed">凯旋</span>
        <span class="myteam-arrow">›</span>
      </div>
    </div>

    <!-- 公开房间 -->
    <div class="section">
      <div class="section-header blue">
        <span style="display:flex;align-items:center;gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          公开房间
        </span>
        <span style="font-size:9px;color:#9ca3af;">招募中 · 5个</span>
      </div>

      <!-- 筛选标签 -->
      <div class="filter-row">
        <button class="filter-pill active">全部</button>
        <button class="filter-pill">梧桐山</button>
        <button class="filter-pill">塘朗山</button>
        <button class="filter-pill">七娘山</button>
        <button class="filter-pill">排牙山</button>
        <button class="filter-pill">银湖山</button>
      </div>

      <!-- 房间网格 -->
      <div class="room-grid">
        <div class="room-card">
          <div class="room-card-img">
            <div class="room-overlay"></div>
            <div class="room-name">梧桐山攀登</div>
            <div class="room-hot">🔥热</div>
            <button class="room-join">+</button>
          </div>
        </div>
        <div class="room-card">
          <div class="room-card-img">
            <div class="room-overlay"></div>
            <div class="room-name">塘朗山慢摇</div>
            <button class="room-join">+</button>
          </div>
        </div>
        <div class="room-card">
          <div class="room-card-img">
            <div class="room-overlay"></div>
            <div class="room-name">七娘山探路</div>
            <div class="room-hot" style="background:#ef4444;">急招</div>
            <button class="room-join">+</button>
          </div>
        </div>
        <div class="room-card">
          <div class="room-card-img">
            <div class="room-overlay"></div>
            <div class="room-name">排牙山穿越</div>
            <button class="room-join">+</button>
          </div>
        </div>
        <div class="room-card">
          <div class="room-card-img">
            <div class="room-overlay"></div>
            <div class="room-name">银湖山晨练</div>
            <button class="room-join">+</button>
          </div>
        </div>
        <div class="room-card">
          <div class="room-card-img">
            <div class="room-overlay"></div>
            <div class="room-name">马峦山徒步</div>
            <button class="room-join">+</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
